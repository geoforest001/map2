<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geoforest Map</title>
    <link rel="preconnect" href="https://tile.openstreetmap.org" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
    <link rel="stylesheet" href="./style.css?v=8" />
  </head>
  <body>
    <main class="page">
      <section class="map-card">
        <div id="map" aria-label="地図"></div>
      </section>
    </main>

    <script
      src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
      integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
      crossorigin=""
    ></script>
    <script src="https://unpkg.com/protomaps-leaflet@5.1.0/dist/protomaps-leaflet.js"></script>
    <!-- 現場掲示板 フロートボタン -->
    <button id="bbsFloatBtn">📋 現場掲示板<span id="bbsBadge"></span></button>

    <!-- 現場掲示板 パネル -->
    <div id="bbsPanel">
      <div id="bbsHandle">
        <div id="bbsHandleGrip"><span></span><span></span><span></span></div>
        <span id="bbsPanelTitle">📋 現場掲示板</span>
        <button id="bbsRefreshBtn" title="更新">🔄</button>
        <button id="bbsCollapseBtn" title="折りたたむ">▾</button>
        <button id="bbsClose">✕</button>
      </div>
      <div id="bbsBody">
        <!-- 投稿者バー -->
        <div id="bbsAuthorBar">
          <span id="bbsAuthorBarLabel">👤 投稿者：</span>
          <span id="bbsAuthorBarName">未登録</span>
          <div id="bbsAuthorEditor" style="display:none">
            <input id="bbsAuthorInput" type="text" placeholder="名前を入力..." maxlength="20">
            <button id="bbsAuthorSaveBtn">登録</button>
          </div>
          <button id="bbsAuthorEditBtn">✏️</button>
        </div>
        <div class="bbs-tabs">
          <button class="bbs-tab active" id="bbsTabList" data-tab="list">投稿一覧</button>
          <button class="bbs-tab" id="bbsTabNew" data-tab="new">＋ 新規投稿</button>
        </div>
        <div id="bbsListPane" class="bbs-pane">
          <div id="bbsLoadingMsg">読み込み中...</div>
          <div id="bbsEmptyMsg" style="display:none">投稿がありません</div>
          <div id="bbsList"></div>
        </div>
        <div id="bbsNewPane" class="bbs-pane" style="display:none">
          <div class="bbs-field">
            <label>カテゴリ</label>
            <select id="bbsCatSel">
              <option value="道路">🛣 道路</option>
              <option value="河川">💧 河川</option>
              <option value="土砂">⛰ 土砂</option>
              <option value="施設">🏢 施設</option>
              <option value="その他">📌 その他</option>
            </select>
          </div>
          <div class="bbs-field">
            <label>コメント <span style="color:#c00">*</span></label>
            <textarea id="bbsComment" rows="3" placeholder="状況を入力..."></textarea>
          </div>
          <div class="bbs-field">
            <label>写真（任意）</label>
            <div style="display:flex;gap:6px;flex-wrap:wrap">
              <button class="bbs-action-btn" id="bbsTakePhotoBtn">📷 撮影する</button>
              <button class="bbs-action-btn" id="bbsPickPhotoBtn">🖼 ギャラリー</button>
            </div>
            <input id="bbsPhotoInput" type="file" accept="image/*" style="display:none">
            <img id="bbsPhotoPreview" style="display:none;max-width:120px;max-height:80px;border-radius:6px;margin-top:6px;cursor:pointer">
          </div>
          <div class="bbs-field">
            <label>位置情報</label>
            <div style="display:flex;align-items:center;flex-wrap:wrap;gap:5px">
              <button class="bbs-action-btn" id="bbsGetLocBtn">📍 現在地を取得</button>
              <span id="bbsLocStatus">未設定</span>
            </div>
          </div>
          <button id="bbsSubmitBtn">📤 投稿する</button>
          <div id="bbsFormStatus"></div>
        </div>
      </div>
    </div>

    <!-- 天気パネル -->
    <div id="wxPanel">
      <div id="wxHandle">
        <div id="wxHandleGrip">
          <div></div><div></div><div></div>
        </div>
        <span id="wxTitle">📍 現在地の天気</span>
        <span id="wxUpdated"></span>
        <button id="wxRefresh" title="更新">🔄</button>
        <button id="wxCollapseBtn" title="折りたたむ">▾</button>
        <button id="wxClose" title="閉じる">✕</button>
      </div>
      <div id="wxBody">
        <div id="wxLoading">取得中...</div>
        <div id="wxContent">
          <div class="wx-section-label">🌤 これからの気象情報</div>
          <div id="wxMain">
            <div id="wxIcon">☀️</div>
            <div id="wxDesc">--</div>
            <div id="wxTemp">↑--° / ↓--°</div>
          </div>
          <div id="wxGrid">
            <div class="wx-cell" id="wxCellRain"><span class="lbl">☔ 降水確率</span><span class="val" id="wxRain">--</span></div>
            <div class="wx-cell" id="wxCellWind"><span class="lbl">🌡 最高気温</span><span class="val" id="wxWind">--</span></div>
            <div class="wx-cell" id="wxCellHumid"><span class="lbl">🌡 最低気温</span><span class="val" id="wxHumid">--</span></div>
          </div>
          <div id="wxDayCards"></div>
          <canvas id="wxChart" height="70"></canvas>
          <div class="wx-section-divider"></div>
          <div class="wx-section-label">📊 ここまでの気象情報</div>
          <div id="wxAmedasLoading">AMeDAS取得中...</div>
          <div id="wxAmedasSection">
            <div id="amStationRow">
              <span id="amStationName">--</span>
              <span id="amDistBadge"></span>
            </div>
            <div id="amedasDataGrid">
              <div class="am-cell" id="amCellTemp"><span class="lbl">🌡 気温</span><span class="val" id="amTemp">--</span></div>
              <div class="am-cell" id="amCellHumid"><span class="lbl">💧 湿度</span><span class="val" id="amHumid">--</span></div>
              <div class="am-cell" id="amCellRain1h"><span class="lbl">☔ 1h雨量</span><span class="val" id="amRain1h">--</span></div>
              <div class="am-cell" id="amCellRain10m"><span class="lbl">☔ 10m雨量</span><span class="val" id="amRain10m">--</span></div>
              <div class="am-cell" id="amCellRain24h"><span class="lbl">☔ 24h雨量</span><span class="val" id="amRain24h">--</span></div>
              <div class="am-cell" id="amCellWind"><span class="lbl">💨 風速</span><span class="val" id="amWind">--</span></div>
              <div class="am-cell" id="amCellWindDir"><span class="lbl">🧭 風向</span><span class="val" id="amWindDir">--</span></div>
              <div class="am-cell" id="amCellSnow"><span class="lbl">❄️ 積雪</span><span class="val" id="amSnow">--</span></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- チャートチップス（モバイル用） -->
    <div id="chartChips"></div>

    <!-- チャートシート（モバイル用） -->
    <div id="chartSheet">
      <div id="chartSheetHandle">
        <span id="chartSheetTitle"></span>
        <button id="chartSheetClose">✕</button>
      </div>
      <div id="chartSheetBody">
        <div id="chartSheetLoading">取得中...</div>
        <canvas id="chartSheetCanvas" style="display:none;"></canvas>
        <div id="chartSheetSrc"></div>
      </div>
    </div>

    <!-- トースト通知 -->
    <div id="toast"></div>

    <!-- ライトボックス -->
    <div id="lightbox"><img id="lightboxImg" alt=""></div>

    <!-- 確認ダイアログ -->
    <div id="confirmOverlay">
      <div id="confirmBox">
        <div id="confirmMsg"></div>
        <div class="c-btns">
          <button class="c-cancel" id="confirmCancel">キャンセル</button>
          <button class="c-ok" id="confirmOk">続行</button>
        </div>
      </div>
    </div>

    <script src="https://unpkg.com/exifr/dist/mini.legacy.umd.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="./main.js?v=27"></script>
    <script src="./weather.js?v=1"></script>
  </body>
</html>
